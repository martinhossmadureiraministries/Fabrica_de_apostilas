name: Validar automação de apostilas

on:
  push:
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"
      - "requirements.txt"
      - "EBE_Mapa_Completo_Apostilas-2.pdf"
      - "_estilos.py"
  pull_request:
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"
      - "requirements.txt"
      - "EBE_Mapa_Completo_Apostilas-2.pdf"
      - "_estilos.py"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar importação do mapa completo
        run: |
          python scripts/importar_mapa_apostilas.py \
            --pdf EBE_Mapa_Completo_Apostilas-2.pdf \
            --saida generated/manifests/mapa_apostilas.jsonl

      - name: Validar geração técnica de um DOCX sem IA
        run: |
          python scripts/gerar_apostilas_ai.py \
            --manifest generated/manifests/mapa_apostilas.jsonl \
            --provider-mode offline \
            --inicio 1 \
            --limite 1 \
            --saida generated/ci-apostilas
