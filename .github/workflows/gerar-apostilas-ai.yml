name: Gerar Apostilas EBE com IA

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Motor de geração (gemini_groq/gemini/groq/offline)"
        type: choice
        default: "offline"
        options:
          - offline
          - groq
          - gemini
          - gemini_groq
      inicio:
        description: "Número inicial da apostila (1-1029)"
        type: string
        default: "1"
      limite:
        description: "Quantidade de apostilas no lote"
        type: string
        default: "1"
      dry_run:
        description: "Apenas listar, não gerar"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gerar-apostilas:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar diretórios de saída
        run: |
          mkdir -p generated/manifests
          mkdir -p generated/apostilas
          mkdir -p apostilas

      - name: Importar mapa de apostilas
        run: |
          python scripts/importar_mapa_apostilas.py \
            --pdf EBE_Mapa_Completo_Apostilas-2.pdf \
            --saida generated/manifests/mapa_apostilas.jsonl

      - name: Gerar apostilas
        run: |
          python scripts/gerar_apostilas_ai.py \
            --manifest generated/manifests/mapa_apostilas.jsonl \
            --provider-mode ${{ inputs.modo }} \
            --inicio ${{ inputs.inicio }} \
            --limite ${{ inputs.limite }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --saida generated/apostilas

      - name: Organizar apostilas em hierarquia
        if: success() && !inputs.dry_run
        run: |
          python scripts/organizar_apostilas.py \
            --manifesto generated/manifests/mapa_apostilas.jsonl \
            --gerados generated/apostilas \
            --saida apostilas

      - name: Fazer commit das apostilas
        if: success() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apostilas/ || true
          git diff --cached --quiet || git commit -m "feat: gerar apostilas lote ${{ inputs.inicio }}-${{ inputs.limite }} (modo: ${{ inputs.modo }})"
          git push || git pull --rebase && git push

      - name: Publicar artefatos para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apostilas-${{ github.run_number }}
          path: apostilas/
          retention-days: 30

      - name: Resumo
        if: always()
        run: |
          echo "✅ Workflow concluído!"
          echo "📊 Modo: ${{ inputs.modo }}"
          echo "📋 Intervalo: ${{ inputs.inicio }} até $((inputs.inicio + inputs.limite - 1))"
          echo "📁 Saída: apostilas/"
          echo "🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
