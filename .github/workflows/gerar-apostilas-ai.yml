name: Gerar apostilas EBE com IA

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Motor de geração"
        required: true
        default: "gemini_groq"
        type: choice
        options:
          - gemini_groq
          - gemini
          - groq
          - offline
      inicio:
        description: "Número inicial da apostila no mapa (1-1029)"
        required: true
        default: "1"
      limite:
        description: "Quantidade máxima no lote (recomendado: 1-10 em APIs grátis)"
        required: true
        default: "3"
      nivel:
        description: "Filtro opcional por nível"
        required: false
        default: ""
      instituto:
        description: "Filtro opcional por instituto"
        required: false
        default: ""
      escola:
        description: "Filtro opcional por escola"
        required: false
        default: ""
      curso:
        description: "Filtro opcional por curso"
        required: false
        default: ""
      modulo:
        description: "Filtro opcional por módulo"
        required: false
        default: ""
      dry_run:
        description: "Só listar o lote; não gerar DOCX nem chamar APIs"
        required: true
        default: false
        type: boolean
      offline_if_missing:
        description: "Se secrets de API estiverem ausentes, gerar em modo offline de teste"
        required: true
        default: false
        type: boolean
      publicar_manifesto:
        description: "Comitar o manifesto/índice gerado usando GITHUB_TOKEN (não comita DOCX)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  gerar:
    name: Gerar lote de apostilas
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Importar mapa oficial de 1.029 apostilas
        run: |
          python scripts/importar_mapa_apostilas.py \
            --pdf EBE_Mapa_Completo_Apostilas-2.pdf \
            --saida generated/manifests/mapa_apostilas.jsonl

      - name: Gerar apostilas do lote
        run: |
          ARGS=(
            --manifest generated/manifests/mapa_apostilas.jsonl
            --provider-mode "${{ inputs.modo }}"
            --inicio "${{ inputs.inicio }}"
            --limite "${{ inputs.limite }}"
          )

          if [[ -n "${{ inputs.nivel }}" ]]; then ARGS+=(--nivel "${{ inputs.nivel }}"); fi
          if [[ -n "${{ inputs.instituto }}" ]]; then ARGS+=(--instituto "${{ inputs.instituto }}"); fi
          if [[ -n "${{ inputs.escola }}" ]]; then ARGS+=(--escola "${{ inputs.escola }}"); fi
          if [[ -n "${{ inputs.curso }}" ]]; then ARGS+=(--curso "${{ inputs.curso }}"); fi
          if [[ -n "${{ inputs.modulo }}" ]]; then ARGS+=(--modulo "${{ inputs.modulo }}"); fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then ARGS+=(--dry-run); fi
          if [[ "${{ inputs.offline_if_missing }}" == "true" ]]; then ARGS+=(--offline-if-missing); fi

          python scripts/gerar_apostilas_ai.py "${ARGS[@]}"

      - name: Publicar artefactos gerados
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apostilas-ebe-${{ github.run_number }}
          path: |
            generated/
          if-no-files-found: warn
          retention-days: 14

      - name: Comitar manifesto e índice com GITHUB_TOKEN
        if: ${{ inputs.publicar_manifesto == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated/manifests/mapa_apostilas.jsonl || true
          git add -f generated/indices/qualidade.jsonl generated/ultima_execucao.json || true
          if git diff --cached --quiet; then
            echo "Sem alterações de manifesto/índice para comitar."
          else
            git commit -m "chore: atualizar manifesto/índice de apostilas geradas"
            git push origin HEAD:${{ github.ref_name }}
          fi
